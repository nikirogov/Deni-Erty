<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><3</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/kindegarten" rel="stylesheet">
    <style>
        /* hide delete button on collapsed .data */
        .data:not(.show) .delete-btn {
            display: none;
        }
    </style>
</head>
<body>
<div class="main">
    <h1>Deni & Erty</h1>
    <h3 class="hints">Pravihte li neshto dnes?</h3>

    <!-- Add event button (opens modal) -->
    <div class="controls">
        <button id="showAddForm"><span>Yess</span></button>
    </div>

    <!-- Modal add-event form -->
    <div id="addEventModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-dialog" role="document">
            <button id="closeModal" class="modal-close" aria-label="Close form">✕</button>
            <form id="addEventForm" class="add-event-form" aria-label="Add timeline event">
                <input name="title" type="text" placeholder="Event title" />
                <input name="date" type="date" required />
                <select name="eventType" required>
                    <option value="">Kude?</option>
                    <option value="date">Date</option>
                    <option value="skip">Peika do Lidl</option>
                    <option value="udeni">U Deni</option>
                    <option value="uerty">U Erty</option>
                    <option value="other">Other</option>
                </select>
                <label><input type="checkbox" name="specialEvent" /> Special Event</label>

                <textarea name="descriptionDeni" placeholder="Deni description" class="deni-comment"></textarea>
                <textarea name="descriptionErty" placeholder="Erty description" class="erty-comment"></textarea>

                <!-- Image upload -->
                <div class="image-upload">
                    <label for="eventImage">Optional Image:</label>
                    <input type="file" id="eventImage" name="eventImage" accept="image/*">
                </div>

                <div class="form-actions">
                    <button type="submit">Add</button>
                    <button type="button" id="cancelAdd">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Timeline wrapper -->
    <div class="timeline-wrapper">
        <ul class="timeline">
            <!-- Timeline events will be dynamically added from Firebase -->
        </ul>
    </div>

    <h3 class ="hints">Statistics</h3>
    <div class="stat-item">
        <h5>Podpisahme dogovor predi:</h5>
        <p id="contractCounter" class="counter">Loading...</p>
    </div>
    <div class="stat-item">
        <h5>Turpim se ot:</h5>
        <p id="turpishCounter" class="counter">Loading...</p>
    </div>

    <div id="calenderContainer">
            <div id = "calendarDiv">
                <div id="calendarHeading">
                    <button id="prevMonth" class="calendar-nav" aria-label="Previous month">◄</button>
                    <p id="habitTitle">Month</p>
                    <button id="nextMonth" class="calendar-nav" aria-label="Next month">►</button>
                    <p id="totalDays">0/31</p>
                </div>
                <div id="calendarContent">
                    <div id="weekdays" class="weekday-labels">
                        <span>Mon</span>
                        <span>Tue</span>
                        <span>Wed</span>
                        <span>Thu</span>
                        <span>Fri</span>
                        <span>Sat</span>
                        <span>Sun</span>
                    </div>
                    <div id="tracker">
                        <!-- Calendar days will be dynamically generated -->
                    </div>
                </div>
            </div>
        </div>

    <!-- Relationship Statistics Section -->
    <h3 class="hints">Oshte statistics</h3>
    <div id="relationshipStats">
        <!-- Stats will be dynamically inserted here -->
    </div>

    <!-- Date Ideas Section -->
    <h3 class="hints">Date Ideas</h3>
    
    <div class="controls">
        <button id="showAddDateIdea" type="button" class="purple-btn">Add Date Idea</button>
    </div>

    <!-- Scheduled Dates -->
    <div id="scheduledDatesSection" style="margin-bottom: 2rem;">
        <h4 style="color: var(--deni-color); margin-bottom: 1rem;">📅 Scheduled Dates</h4>
        <div id="scheduledDatesList" class="scheduled-dates-list">
            <!-- Scheduled dates will appear here -->
        </div>
    </div>

    <!-- Modal add-date-idea form -->
    <div id="addDateIdeaModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-dialog" role="document">
            <button id="closeDateIdeaModal" class="modal-close" aria-label="Close form">✕</button>
            <form id="addDateIdeaForm" class="add-event-form" aria-label="Add date idea">
                <input name="title" type="text" placeholder="Date idea title" required />
                <input name="place" type="text" placeholder="Place (optional)" />
                <textarea name="description" placeholder="Description (optional)"></textarea>
                <div class="form-actions">
                    <button type="submit">Add Idea</button>
                    <button type="button" id="cancelAddDateIdea">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <ul id="dateIdeasList" class="date-ideas-list"></ul>

    <!-- Shared Photos Section -->
    <h3 class="hints">Our Photos</h3>
    
    <div class="controls">
        <button id="showAddPhoto" type="button" class="purple-btn">Upload Photo</button>
    </div>

    <!-- Modal add-photo form -->
    <div id="addPhotoModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-dialog" role="document">
            <button id="closePhotoModal" class="modal-close" aria-label="Close form">✕</button>
            <form id="addPhotoForm" class="add-event-form" aria-label="Add photo">
                <input name="caption" type="text" placeholder="Caption (optional)" />
                <div class="file-input-wrapper">
                    <label for="photoFileInput" style="display: block; margin-bottom: 0.5rem; color: #222; font-weight: 500;">Select Photo:</label>
                    <input type="file" id="photoFileInput" name="photoFile" accept="image/*" required />
                </div>
                <div class="form-actions">
                    <button type="submit">Upload</button>
                    <button type="button" id="cancelAddPhoto">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="photoGallery" class="photo-gallery"></div>
</div>

<script type="module" src="timeline.js"></script>
</body>
</html>
