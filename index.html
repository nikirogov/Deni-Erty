<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><3</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/kindegarten" rel="stylesheet">
    <style>
        /* hide delete button on collapsed .data */
        .data:not(.show) .delete-btn {
            display: none;
        }
    </style>
</head>
<body>
<div class="main">
    <h1>Deni & Erty</h1>
    <h3 class="hints">Pravihte li neshto dnes?</h3>

    <!-- Add event button (opens modal) -->
    <div class="controls">
        <button id="showAddForm"><span>Yess</span></button>
    </div>

    <!-- Modal add-event form -->
    <div id="addEventModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-dialog" role="document">
            <button id="closeModal" class="modal-close" aria-label="Close form">✕</button>
            <form id="addEventForm" class="add-event-form" aria-label="Add timeline event">
                <input name="title" type="text" placeholder="Event title" />
                <input name="date" type="date" required />
                <select name="eventType" required>
                    <option value="">Kude?</option>
                    <option value="date">Date</option>
                    <option value="skip">Peika do Lidl</option>
                    <option value="udeni">U Deni</option>
                    <option value="uerty">U Erty</option>
                    <option value="other">Other</option>
                </select>
                <label><input type="checkbox" name="specialEvent" /> Special Event</label>

                <textarea name="descriptionDeni" placeholder="Deni description" class="deni-comment"></textarea>
                <textarea name="descriptionErty" placeholder="Erty description" class="erty-comment"></textarea>

                <!-- Image upload -->
                <div class="image-upload">
                    <label for="eventImage">Optional Image:</label>
                    <input type="file" id="eventImage" name="eventImage" accept="image/*">
                </div>

                <div class="form-actions">
                    <button type="submit">Add</button>
                    <button type="button" id="cancelAdd">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Timeline wrapper -->
    <div class="timeline-wrapper">
        <ul class="timeline">
            <!-- Timeline events will be dynamically added from Firebase -->
        </ul>
    </div>

    <h3 class ="hints">Statistics</h3>
    <div class="stat-item">
        <h5>Podpisahme dogovor predi:</h5>
        <p id="contractCounter" class="counter">Loading...</p>
    </div>
    <div class="stat-item">
        <h5>Turpim se ot:</h5>
        <p id="turpishCounter" class="counter">Loading...</p>
    </div>

    <div id="calenderContainer">
            <div id = "calendarDiv">
                <div id="calendarHeading">
                    <button id="prevMonth" class="calendar-nav" aria-label="Previous month">◄</button>
                    <p id="habitTitle">Month</p>
                    <button id="nextMonth" class="calendar-nav" aria-label="Next month">►</button>
                    <p id="totalDays">0/31</p>
                </div>
                <div id="calendarContent">
                    <div id="weekdays" class="weekday-labels">
                        <span>Mon</span>
                        <span>Tue</span>
                        <span>Wed</span>
                        <span>Thu</span>
                        <span>Fri</span>
                        <span>Sat</span>
                        <span>Sun</span>
                    </div>
                    <div id="tracker">
                        <!-- Calendar days will be dynamically generated -->
                    </div>
                </div>
            </div>
        </div>

    <!-- Relationship Statistics Section -->
    <h3 class="hints">Oshte statistics</h3>
    <div id="relationshipStats">
        <!-- Stats will be dynamically inserted here -->
    </div>

    <h3 class="hints">Quotes</h3>
    <div class="controls">
        <button id="showAddQuote" type="button">Add Quote</button>
    </div>

    <!-- Modal add-quote form -->
    <div id="addQuoteModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-dialog" role="document">
            <button id="closeQuoteModal" class="modal-close" aria-label="Close form">✕</button>
            <form id="addQuoteForm" class="add-event-form" aria-label="Add quote">
                <textarea name="quote" placeholder="Quote text" required></textarea>
                <select name="person" id="personSelect" required>
                    <option value="">Koj?</option>
                    <option value="deni">Deni</option>
                    <option value="erty">Erty</option>
                    <option value="other">Other</option>
                </select>
                <input name="personName" id="personNameInput" type="text" placeholder="Name (if Other)" style="display: none;" />
                <div class="form-actions">
                    <button type="submit">Add Quote</button>
                    <button type="button" id="cancelAddQuote">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <ul id="quotesList" class="quotes-list"></ul>

    <h3 class="hints">Kakwo da kaja na Deni?</h3>
    <div class="controls">
        <button id="showAddQuote" type="button">Umna misul</button>
    </div>
</div>

<script type="module" src="timeline.js"></script>
</body>
</html>
